<!doctype html><html lang="de"><meta charset="utf-8"/><title>Central Overview Card Browser Smoke</title>
<style>
:root{--ha-card-background:#fff;--card-background-color:#fff;--primary-text-color:#24292f;--secondary-text-color:#64748b;--divider-color:#e5e7eb;--primary-color:#039be5;--ha-card-border-radius:15px;--red-color:#f44336;--success-color:#43a047;--error-color:#d93025;--warning-color:#f9ab00;--info-color:#1976d2;--orange-color:#fb8c00;--cyan-color:#00acc1;--purple-color:#8e5bd3;--pink-color:#e91e63;--amber-color:#ffc107;--text-primary-color:#fff}
body{margin:0;padding:30px;background:#f0f3f8;font-family:Roboto,'Segoe UI',sans-serif;display:grid;grid-template-columns:480px 430px;gap:28px;align-items:start}
section>h2{font-size:18px;color:#1f2937;margin:0 0 12px}section{min-width:0}
ha-icon{display:inline-flex;align-items:center;justify-content:center;font-size:23px;width:25px;height:25px;font-family:Arial}
</style><script>
customElements.define('ha-icon', class extends HTMLElement {connectedCallback(){this.textContent=({'mdi:shield-home':'⬟','mdi:window-closed':'▣','mdi:lightbulb-group':'☀','mdi:power-plug':'ϟ','mdi:radiator':'♨','mdi:air-conditioner':'❄','mdi:music':'♫','mdi:blinds':'▥','mdi:television':'▣','mdi:air-filter':'≋','mdi:lock':'⌑','mdi:alarm':'◷','mdi:motion-sensor':'⌁','mdi:account-group':'♟','mdi:car':'▰','mdi:robot':'⚙'}[this.getAttribute('icon')]||'●')}});
customElements.define('ha-entity-picker', class extends HTMLElement {connectedCallback(){this.style.display='block';this.style.border='1px solid #d1d5db';this.style.background='#fff';this.style.minHeight='34px';this.style.borderRadius='7px';this.style.padding='7px';this.style.boxSizing='border-box';this.textContent=this.value||'Entität auswählen ▾';}set value(v){this._value=v;this.textContent=v||'Entität auswählen ▾'}get value(){return this._value||''}});
</script>
<script src="../dist/central-overview-card.js"></script>
<body>
<section><h2>Zentralübersicht · 16 Kacheln</h2><div id="dashboard"></div></section>
<section><h2>Visueller Editor · Home Assistant</h2><div id="visual-editor"></div></section>
<script>
let S=(entity_id,state,attributes={})=>({entity_id,state,attributes});
const states={
'alarm_control_panel.demo':S('alarm_control_panel.demo','disarmed'),
'binary_sensor.windows_a':S('binary_sensor.windows_a','on',{device_class:'window'}),
'binary_sensor.windows_b':S('binary_sensor.windows_b','off',{device_class:'window'}),
'light.living':S('light.living','on'),'light.kitchen':S('light.kitchen','on'),
'switch.outlet':S('switch.outlet','on',{device_class:'outlet'}),
'climate.heating':S('climate.heating','heat',{hvac_modes:['off','heat']}),
'climate.cooling':S('climate.cooling','cool',{hvac_modes:['off','cool','heat']}),
'media_player.speaker':S('media_player.speaker','playing',{device_class:'speaker'}),
'media_player.tv':S('media_player.tv','off',{device_class:'tv'}),
'cover.blinds':S('cover.blinds','closed',{current_position:0}),
'sensor.air':S('sensor.air','gut'),
'lock.door':S('lock.door','locked'),
'switch.wakeup':S('switch.wakeup','off'),
'binary_sensor.motion':S('binary_sensor.motion','on',{device_class:'motion'}),
'person.demo_a':S('person.demo_a','home'),
'person.demo_b':S('person.demo_b','not_home'),
'binary_sensor.vehicle':S('binary_sensor.vehicle','off'),
'automation.morning':S('automation.morning','on'),
'automation.evening':S('automation.evening','on')};
const hass={states,entities:{'light.living':{area_id:'wohnzimmer'},'light.kitchen':{area_id:'kueche'},'binary_sensor.motion':{area_id:'wohnzimmer'}},areas:{wohnzimmer:{area_id:'wohnzimmer',name:'Wohnzimmer'},kueche:{area_id:'kueche',name:'Küche'}}};
const card=document.createElement('central-overview-card'); const stub=card.constructor.getStubConfig();
const c={type:'custom:central-overview-card',...stub,tiles:stub.tiles.map(t=>({...t}))};
const selection=(k,entities,options={})=>Object.assign(c.tiles.find(t=>t.kind===k),{source:'selected',entities},options);
selection('air',['sensor.air']);selection('alarmclock',['switch.wakeup']);selection('vehicles',['binary_sensor.vehicle'],{active_state:'off'});
card.setConfig(c); card.hass=hass;document.getElementById('dashboard').append(card);
const editor=document.createElement('central-overview-card-editor');editor.setConfig(c);editor.hass=hass;document.getElementById('visual-editor').append(editor);
window.card=card;window.editor=editor;window.hassMock=hass;window.config=stub;window.changes=[];editor.addEventListener('config-changed',e=>window.changes.push(e.detail.config));
</script></body></html>
